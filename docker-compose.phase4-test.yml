# Disposable Phase 4 NAS observation stack.
#
# This file is intentionally separate from docker-compose.nas.yml. It uses a
# unique stack name, ports, volumes, and network so it cannot reuse or
# recreate the production OpenChronicle container or its SQLite database.
# The OC image is supplied explicitly through OC_TEST_IMAGE because this
# stack is for a locally built/test-tagged image, not a release deployment.

services:
  oc:
    image: ${OC_TEST_IMAGE:?set OC_TEST_IMAGE to the metrics-enabled test image}
    restart: unless-stopped
    # The NAS kernel does not expose Docker's CFS quota controller. Pin the
    # disposable service to two logical CPUs instead; this limits its CPU
    # placement without using the unsupported `cpus`/NanoCPUs setting.
    cpuset: ${OC_TEST_CPUSET:-0-1}
    networks:
      oc-phase4:
        aliases:
          - oc
    ports:
      - "${OC_TEST_HTTP_PORT:-18080}:8000"
    environment:
      OC_API_HOST: "0.0.0.0"
      OC_API_PORT: "8000"
      OC_CONFIG_DIR: /config
      OC_DB_PATH: /data/openchronicle.db
      OC_OUTPUT_DIR: /output
      # Deliberately enabled in this disposable test stack. The default
      # production/development configuration remains false.
      OC_METRICS_ENABLED: "true"
      OC_API_KEY: ${OC_TEST_API_KEY:-}
      OC_API_CORS_ORIGINS: ""
      OC_API_RATE_LIMIT_RPM: "100000"
      OC_API_ALLOWED_HOSTS: ${OC_TEST_API_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,[::1]:*,oc:*,carldog-nas:*,carldog-nas.local:*}
      OC_MCP_ALLOWED_HOSTS: ${OC_TEST_MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,[::1]:*,oc:*,carldog-nas:*,carldog-nas.local:*}
      OC_EMBEDDING_PROVIDER: stub
      OC_EMBEDDING_MODEL: stub
      OC_SEARCH_FTS5_ENABLED: "1"
      OC_MAINTENANCE_DISABLED: "1"
      OC_LOG_FORMAT: json
      OC_LOG_LEVEL: INFO
      OC_LOG_FILE: /output/logs/openchronicle-phase4-test.log
    volumes:
      - oc-phase4-test-data:/data
      - oc-phase4-test-config:/config
      - oc-phase4-test-output:/output
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:8000/health'',timeout=3).status==200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    networks:
      - oc-phase4
    depends_on:
      oc:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OC_TEST_PROMETHEUS_PORT:-19080}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=256MB
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22openchronicle-phase4-test%22%7D' | grep -q '\\,\"1\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    configs:
      - source: phase4_prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - oc-phase4-test-prometheus:/prometheus

configs:
  phase4_prometheus_config:
    content: |
      global:
        scrape_interval: 5s
        scrape_timeout: 4s
        evaluation_interval: 5s
      scrape_configs:
        - job_name: openchronicle-phase4-test
          scheme: http
          metrics_path: /metrics
          static_configs:
            - targets:
                - oc:8000
              labels:
                service: openchronicle-phase4-test

volumes:
  oc-phase4-test-data:
  oc-phase4-test-config:
  oc-phase4-test-output:
  oc-phase4-test-prometheus:

networks:
  oc-phase4:
    driver: bridge
