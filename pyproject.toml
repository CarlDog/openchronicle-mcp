[build-system]
# Floors picked to dodge known CVEs flagged by pip-audit on the slim
# base image (setuptools PYSEC-2025-49 + CVE-2024-6345,
# wheel CVE-2026-24049). The Dockerfile also upgrades pip/setuptools/
# wheel ahead of the package install for the same reason.
requires = ["setuptools>=78.1.1", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "openchronicle-mcp"
version = "3.2.0"
description = "Memory database for LLM agents — persistent keyword + optional semantic memory, project namespacing, served over HTTP REST and MCP."
authors = [{name = "CarlDog", email = "carldog@users.noreply.github.com"}]
maintainers = [{name = "CarlDog", email = "carldog@users.noreply.github.com"}]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.14"
keywords = ["llm", "ai", "memory", "mcp", "embeddings", "fts5", "sqlite"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: GNU Affero General Public License v3",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.14",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
	"Typing :: Typed",
]
dependencies = [
	"fastapi>=0.110.0",
	"uvicorn[standard]>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/CarlDog/openchronicle-mcp"
Repository = "https://github.com/CarlDog/openchronicle-mcp"
Issues = "https://github.com/CarlDog/openchronicle-mcp/issues"
Documentation = "https://github.com/CarlDog/openchronicle-mcp/tree/main/docs"

[project.optional-dependencies]
# Embedding-provider extras. v2's anthropic/groq/gemini/discord
# extras are gone — v3 has no LLM, no Discord. OpenAI and Ollama
# survive solely as embedding providers. numpy is shared across the
# embedding extras because EmbeddingService.search_hybrid uses it for
# vectorized cosine similarity on the read path.
openai = [
	"openai>=1.0.0",
	"numpy>=1.24",
]
ollama = [
	"httpx>=0.25.0",
	"numpy>=1.24",
]
mcp = [
	# Floor 1.29: the version the MCP surface baselines were captured on
	# (tests/test_mcp_tool_schema_snapshot.py, tests/test_mcp_error_shape.py).
	# The old >=1.0 floor was fiction — nothing ever verified the server
	# against it, and a resolver free to pick 1.0 would not have run.
	#
	# Cap <2: in mcp 2.x `mcp.server.fastmcp` is a tombstone module that
	# raises ModuleNotFoundError on import, so an unpinned rebuild ships a
	# container that dies on startup. Verified against the 2.1.1 wheel
	# 2026-08-28 — FastMCP was RENAMED IN-TREE to
	# `mcp.server.mcpserver.MCPServer`. It did NOT move to the standalone
	# PyPI `fastmcp` project, which this comment used to claim.
	# See the V3_PLAN "mcp 2.x migration" entry for the verified scope.
	"mcp>=1.29,<2",
]
dev = [
	"pytest>=7",
	"pytest-asyncio>=0.23",
	"mypy>=1.8",
	# Minor-pinned: the formatter's style evolves across minors (0.16
	# started writing PEP 758 unparenthesized excepts under py314), and
	# CI resolves fresh while the venv + pre-commit hook lag — an open
	# floor let CI fail format-check on code the local gate had passed.
	# Dependabot's pip-dev group raises the cap when a new minor lands.
	"ruff>=0.16,<0.17",
	"openai>=1.0.0",
	"httpx>=0.25.0",
	# Keep in step with the [mcp] extra above — that comment carries the
	# reasoning. This is the copy CI's test job actually installs, so an
	# older floor here would resolve the MCP baseline tests against a
	# version they were never captured on.
	"mcp>=1.29,<2",
	"numpy>=1.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
# No custom markers. The `integration` marker was registered here long
# after tests/integration/ was cut in v3 and no test ever used it again;
# it was removed 2026-08-28 along with the `-m "not integration"` filters
# in test.yml and .pre-commit-config.yaml that selected against nothing.
#
# The suite emits exactly one warning, and it is UPSTREAM, not ours:
#   pydantic_settings IncompleteFieldDefinitionWarning on field 'lifespan'
# `lifespan` is not a field we declare — it is a constructor argument we
# pass to FastMCP (interfaces/mcp/server.py), whose own settings model
# carries the unresolved forward reference. Deliberately NOT silenced via
# filterwarnings: suppressing it would also hide the day it changes or
# multiplies, and the mcp 2.x migration in V3_PLAN's follow-ups is the
# point at which it should disappear on its own.

[project.scripts]
oc = "openchronicle.interfaces.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openchronicle = ["**/*.sql"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "PIE",    # flake8-pie
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    # "TCH",  # flake8-type-checking (disabled for cleaner code)
]
ignore = [
    "E501",   # line too long (handled by formatter)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["B", "SIM"]  # Less strict for tests

[tool.ruff.lint.isort]
known-first-party = ["openchronicle"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.helpers"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true
