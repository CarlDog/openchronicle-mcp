name: Build and Push Docker Image

on:
  push:
    branches: [main, v3/develop]
    tags: ["v*"]
    # Docs-only changes can't affect the image (build context is just the
    # app source + Dockerfile). Skipping them avoids republishing :latest,
    # which would otherwise force-pull + bounce the auto-deploying stack
    # for a pure documentation commit.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".env.example"
      - ".gitattributes"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only. Every deployment target is x86-64 (the containers
          # run as Portainer stacks on an amd64 host); nothing in the fleet
          # runs on ARM, so a QEMU-emulated arm64 build is ~5x slower for an
          # image no one pulls. Re-add linux/arm64 here if an ARM host ever
          # joins the fleet. See lessons/docker-multiarch-only-what-you-deploy.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
