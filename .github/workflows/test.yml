name: Test

on:
  push:
    # v4/develop is the v4.0.0 development line (ADR 0008 et al.):
    # full test + quality on every push, but NO image publish — the
    # build-and-push job is gated to main + tags below, so prod
    # (main, OC_TAG-pinned) can never pull v4 work by accident.
    branches: [main, v4/develop]
    tags: ["v*"]
    # Changes that can't affect the image, tests, or lint (build context
    # is just the app source + Dockerfile). Skipping them avoids both
    # wasted CI minutes and republishing :latest, which would otherwise
    # force-pull + bounce the auto-deploying stack for a pure
    # documentation/tooling commit. package*.json is markdownlint dev
    # tooling only — before it was listed here, every weekly Dependabot
    # npm bump rebuilt and republished the image for nothing.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".env.example"
      - ".gitattributes"
      - "package.json"
      - "package-lock.json"
      - ".pre-commit-config.yaml"
      - ".githooks/**"
      - ".github/dependabot.yml"
      - ".github/FUNDING.yml"
      - ".codex/**"
      - "uv.lock"
      - ".github/workflows/gitleaks.yml"
      - ".github/workflows/retag-image.yml"
  pull_request:
    branches: [main]

# Two rapid pushes to main otherwise run build-and-push concurrently,
# and whichever finishes LAST owns :latest — possibly the older commit.
# Queue runs per ref instead; never cancel (a tag build must complete).
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

# Default for every job that doesn't declare its own permissions block
# (test, quality) — read-only least-privilege for the GITHUB_TOKEN
# (CodeQL actions/missing-workflow-permissions). build-and-push below
# needs packages: write for the GHCR push, so it keeps its own
# job-level block, which overrides this default for that job only.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macOS leg dropped (REJ-04, rejected pattern): zero users deploy
      # here, ~50% extra matrix time, has never caught anything ubuntu
      # didn't already catch. Re-add only if an actual macOS deployment
      # target appears.
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev,mcp,openai,ollama]"

      - name: Test
        # Integration tests require live provider keys and the
        # `integration` marker; CI validates unit + functional only.
        # -v gives per-test names so a hang surfaces which test died.
        run: pytest -v

  quality:
    name: lint + format + types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev,mcp,openai,ollama]"

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Mypy
        run: mypy src tests --config-file=pyproject.toml

      # Release integrity: the version stayed at 3.0.0.dev0 through five
      # rc tags, which made health's package_version useless as a deploy
      # verification signal. A v* tag must match pyproject's version
      # (v3.0.0-rc6 <-> 3.0.0rc6) or nothing ships.
      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          norm = tag.removeprefix("v").replace("-rc", "rc")
          if norm != version:
              sys.exit(f"tag {tag} (normalized {norm}) != pyproject version {version}")
          print(f"tag {tag} matches pyproject version {version}")
          EOF

  build-and-push:
    name: Build and push Docker image
    # Only on push to MAIN or a tag — never on pull_request, never for
    # v4/develop (that line tests without publishing), and never if
    # test/quality didn't both pass. The needs: gate is the fix for
    # UNI-14: previously a separate docker-publish.yml workflow had no
    # `needs:` at all, so a red pytest/quality run could still ship
    # :latest to ghcr.io, which the NAS Portainer stack git-polls and
    # auto-pulls.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [test, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No QEMU step: the build is linux/amd64 only (native on this
      # runner). Re-add docker/setup-qemu-action if an ARM target
      # ever joins the platforms list.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only. Every deployment target is x86-64 (the containers
          # run as Portainer stacks on an amd64 host); nothing in the fleet
          # runs on ARM, so a QEMU-emulated arm64 build is ~5x slower for an
          # image no one pulls. Re-add linux/arm64 here if an ARM host ever
          # joins the fleet. See lessons/docker-multiarch-only-what-you-deploy.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked to /app/build-revision so health/`oc version` can name
          # the exact build — package_version alone cannot distinguish
          # two images built from the same version.
          build-args: |
            OC_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
