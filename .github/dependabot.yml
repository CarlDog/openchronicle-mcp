# Dependabot config for openchronicle-mcp (v3).
#
# Targets default branch (main) — v3/develop targeting was removed
# 2026-05-06 post-cutover (per V3_PLAN.md Phase 9 Day 0 checklist).

version: 2
updates:
  # ── npm (package.json present) ────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
      npm-runtime:
        dependency-type: production
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      # Mirrors the npm block's dev/runtime/major split. Previously a single
      # python-minor-and-patch group covered both dev and production deps
      # with no dependency-type distinction, so the fleet auto-merge
      # script's ALLOWED_GROUPS prefix match (which requires "pip-dev")
      # never matched anything in this repo — pip is this repo's primary
      # ecosystem, so no pip PR could ever auto-merge (standards-gap PY-04).
      pip-dev:
        dependency-type: development
        update-types: [minor, patch]
      pip-runtime:
        dependency-type: production
        update-types: [minor, patch]
      pip-major:
        update-types: [major]
    ignore:
      # In mcp 2.x `mcp.server.fastmcp` is a tombstone that raises
      # ModuleNotFoundError, so the major bump ships a server dying on
      # import and its PR is permanently red until the migration lands
      # (V3_PLAN follow-up "mcp 2.x migration"). Stop re-opening it.
      #
      # NB: FastMCP was renamed in-tree to mcp.server.mcpserver.MCPServer;
      # it did NOT move to the standalone PyPI `fastmcp` project, as this
      # comment previously claimed. Corrected 2026-08-28 against the 2.1.1
      # wheel. The ignore stands either way — only the reason was wrong.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    groups:
      actions-all:
        update-types:
          - minor
          - patch
          - major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
