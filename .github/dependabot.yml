# Dependabot config for openchronicle-mcp (v3).
#
# Targets default branch (main) — v3/develop targeting was removed
# 2026-05-06 post-cutover (per V3_PLAN.md Phase 9 Day 0 checklist).

version: 2
updates:
  # ── npm (package.json present) ────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
      npm-runtime:
        dependency-type: production
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  # `uv`, not `pip`: this repo resolves through uv.lock, and the pip
  # ecosystem does not manage that lockfile. Under pip, Dependabot fell back
  # to widening the `>=` ranges in pyproject.toml and never touched uv.lock —
  # so every PR raised a floor that nothing actually installs against, while
  # the resolved versions stayed frozen. Those are "update requirement" PRs
  # rather than version updates, which is also why none of them ever landed
  # in a group (fixed 2026-09-01; five such PRs were closed as no-ops).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      # Mirrors the npm block's dev/runtime/major split. The group NAMES are
      # load-bearing: fleet/scripts/auto-merge-dependabot.py matches
      # ALLOWED_GROUPS by prefix, so `uv-dev` must exist in both files or
      # auto-merge silently stops. Renaming here without updating that list
      # is how this repo previously ended up with no auto-mergeable pip PRs
      # at all (standards-gap PY-04).
      uv-dev:
        dependency-type: development
        update-types: [minor, patch]
      uv-runtime:
        dependency-type: production
        update-types: [minor, patch]
      uv-major:
        update-types: [major]
    ignore:
      # In mcp 2.x `mcp.server.fastmcp` is a tombstone that raises
      # ModuleNotFoundError, so the major bump ships a server dying on
      # import and its PR is permanently red until the migration lands
      # (V3_PLAN follow-up "mcp 2.x migration"). Stop re-opening it.
      #
      # NB: FastMCP was renamed in-tree to mcp.server.mcpserver.MCPServer;
      # it did NOT move to the standalone PyPI `fastmcp` project, as this
      # comment previously claimed. Corrected 2026-08-28 against the 2.1.1
      # wheel. The ignore stands either way — only the reason was wrong.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    groups:
      actions-all:
        update-types:
          - minor
          - patch
          - major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
