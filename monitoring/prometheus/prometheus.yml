# Local-only Prometheus configuration for the opt-in metrics profile.
#
# Both services use the shared Docker bridge, so the collector scrapes OC's
# published port on the host (default 18000; change the target if
# HOST_HTTP_PORT moves). When enabling this collector, set
# OC_API_ALLOWED_HOSTS explicitly to include both the external REST hosts and
# `host.docker.internal:*` for this target.

global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s

scrape_configs:
  - job_name: openchronicle
    scheme: http
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - host.docker.internal:18000
        labels:
          service: openchronicle
