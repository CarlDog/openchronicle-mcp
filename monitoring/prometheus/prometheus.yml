# Local-only Prometheus configuration for the opt-in metrics profile.
#
# The target is reachable by service name on the private compose network.
# When enabling this collector, set OC_API_ALLOWED_HOSTS explicitly to include
# both the external REST hosts and `oc:*` for this private-network target.

global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s

scrape_configs:
  - job_name: openchronicle
    scheme: http
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - oc:8000
        labels:
          service: openchronicle
