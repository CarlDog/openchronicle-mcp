# OpenChronicle v3 — NAS deployment (Portainer stack)
#
# The unified ASGI service serves the HTTP REST surface
# at /api/v1/* and the MCP streamable-HTTP transport at /mcp on the same
# port. The optional `metrics` profile adds a local Prometheus collector; it
# is not started by the default compose invocation. v2's three-service split
# (serve / mcp / discord) is gone with
# the conversation/Discord/separate-MCP subsystems on
# `archive/openchronicle.v2`.
#
# === Stack-level environment variables ===
# Values using ${VAR} syntax come from Portainer's stack Environment
# variables (Stacks → this stack → Environment variables). Hardcoded
# values are container-internal paths and the deployment shape — they
# don't change per environment.
#
#   Recommended:
#     OC_API_KEY            Bearer token for HTTP API auth. Without it,
#                           anything on the NAS network can hit :8000.
#     OC_API_CORS_ORIGINS   Comma-separated browser origins allowed for
#                           cross-origin API calls.
#     OC_EMBEDDING_PROVIDER none (default) | stub | openai | ollama
#                           Set to enable hybrid FTS5+semantic search.
#     OC_EMBEDDING_MODEL    Provider-specific embedding model name.
#     OC_EMBEDDING_API_KEY  Explicit embedding API key override.
#
#   Optional — persistent storage:
#     The DB and internal runtime state live in the `oc-data` named
#     volume (never operator-relocatable). The config dir defaults to
#     a named volume too; set HOST_CONFIG_DIR to a host path to switch
#     to bind-mount mode.
#       HOST_CONFIG_DIR     Host path for /config (core.json). On first
#                           start with an empty
#                           bind-mount, the entrypoint copies example
#                           configs (creates a .bootstrapped marker so
#                           it doesn't repeat).
#
#   Optional — deployment shape:
#     OC_TAG                Image tag. REQUIRED — deploy fails with an
#                           explicit error when unset, rather than
#                           silently falling back to :latest (which
#                           would make every green main push a
#                           surprise deploy on the next redeploy).
#                           Pin to a release tag (v3.0.0) or a SHA.
#     HOST_HTTP_PORT        Host port for the unified app (default:
#                           18000 — matches the v2 HTTP port; MCP is
#                           reachable at the same port at /mcp now).
#                           Override only if you redeploy somewhere
#                           that already binds 18000.
#     OC_LOG_FORMAT         "human" (default) or "json" for Loki/
#                           OpenSearch/Datadog ingestion.
#     OC_LOG_LEVEL          DEBUG | INFO (default) | WARNING | ERROR.
#     OLLAMA_HOST           e.g. http://host.docker.internal:11434
#                           if Ollama runs on the NAS host (used for
#                           embeddings only — there's no LLM in v3).
#     OC_GIT_TOKEN          GitHub PAT for `onboard_git` to clone
#                           private repos (fine-grained, contents:read
#                           scope). Public repos work without it.
#
#   Optional — metrics profile (off unless explicitly selected):
#     OC_METRICS_ENABLED       Set true before starting the `metrics` profile.
#     HOST_PROMETHEUS_PORT     Loopback UI port (default: 19090).
#     HOST_PROMETHEUS_DATA_DIR Local filesystem for collector data; the
#                              default is the named `prometheus-data` volume.
#     HOST_PROMETHEUS_SECRETS_DIR Local directory containing `oc-api-key`
#                              when authenticated scraping is used.
#     PROMETHEUS_CONFIG_FILE   `/etc/prometheus/openchronicle.yml` by default;
#                              use `openchronicle-auth.yml` with OC_API_KEY.
#
# Image: ghcr.io/carldog/openchronicle-mcp (linux/amd64, published by
# GitHub Actions on every push to main).

services:
  oc:
    image: ghcr.io/carldog/openchronicle-mcp:${OC_TAG:?set OC_TAG to the release tag this stack should run (e.g. v3.0.0) — no :latest fallback}
    restart: unless-stopped
    networks:
      - oc-observability
    ports:
      - "${HOST_HTTP_PORT:-18000}:8000"
    environment:
      # Container-internal storage paths (operators tune the *host* side
      # via HOST_*_DIR vars in the volumes section, not these). The DB
      # is intentionally NOT operator-tunable: the named-volume mount at
      # /data keeps the SQLite file safe from external interference.
      OC_CONFIG_DIR: /config
      OC_DB_PATH: /data/openchronicle.db
      OC_OUTPUT_DIR: /output
      # Bind the unified ASGI to all interfaces inside the container.
      OC_API_HOST: 0.0.0.0
      OC_API_PORT: "8000"
      # Runtime collection remains off unless the operator explicitly enables
      # it together with the optional Prometheus profile.
      OC_METRICS_ENABLED: ${OC_METRICS_ENABLED:-false}
      # Auth + CORS (Portainer stack env):
      OC_API_KEY: ${OC_API_KEY:-}
      OC_API_CORS_ORIGINS: ${OC_API_CORS_ORIGINS:-}
      # Rate limit ceiling — the var behind the mnemosyne Phase C
      # incident; must be Portainer-tunable without a compose edit:
      OC_API_RATE_LIMIT_RPM: ${OC_API_RATE_LIMIT_RPM:-}
      # REST Host allowlist. The default includes the private `oc` service
      # alias for the profile-gated collector; retain it when overriding.
      OC_API_ALLOWED_HOSTS: ${OC_API_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,[::1]:*,oc:*}
      # Embeddings (Portainer stack env; default 'none' = FTS5-only):
      OC_EMBEDDING_PROVIDER: ${OC_EMBEDDING_PROVIDER:-}
      OC_EMBEDDING_MODEL: ${OC_EMBEDDING_MODEL:-}
      OC_EMBEDDING_DIMENSIONS: ${OC_EMBEDDING_DIMENSIONS:-}
      OC_EMBEDDING_TIMEOUT: ${OC_EMBEDDING_TIMEOUT:-}
      OC_EMBEDDING_API_KEY: ${OC_EMBEDDING_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      # https:// Ollama hosts are first-class; set 0 for LAN self-signed certs.
      OLLAMA_VERIFY_TLS: ${OLLAMA_VERIFY_TLS:-1}
      # Search + maintenance kill switches (documented escape hatches;
      # unreachable from Portainer until these lines existed). FTS5
      # defaults to a literal "1", not "" — the stack git-polls compose
      # ahead of any image pull, and pre-rc6 images read an injected ""
      # as falsy, which would have silently disabled FTS5 on the live
      # container until OC_TAG moved:
      OC_SEARCH_FTS5_ENABLED: ${OC_SEARCH_FTS5_ENABLED:-1}
      OC_MAINTENANCE_DISABLED: ${OC_MAINTENANCE_DISABLED:-}
      # MCP transport security (Portainer stack env). Default of empty
      # falls through to MCPConfig's localhost-only allowlist; operators
      # binding to a LAN-reachable interface MUST set this in the
      # Portainer stack to include their hostname or all non-loopback
      # clients get 421 Invalid Host header. See env_vars.md.
      OC_MCP_ALLOWED_HOSTS: ${OC_MCP_ALLOWED_HOSTS:-}
      # Git onboarding (Portainer stack env):
      OC_GIT_TOKEN: ${OC_GIT_TOKEN:-}
      # Logging posture (Q19 locked):
      OC_LOG_FORMAT: ${OC_LOG_FORMAT:-human}
      # Rotating file mirror of the log stream (5 MiB x 4 on the output
      # volume). Container stderr dies with the container — a Portainer
      # redeploy RECREATES it, so the previous release's logs vanish at
      # exactly the moment a regression report needs them (observed
      # 2026-08-29). Empty disables; stderr always stays on.
      OC_LOG_FILE: ${OC_LOG_FILE:-/app/output/logs/openchronicle.log}
      OC_LOG_LEVEL: ${OC_LOG_LEVEL:-INFO}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - oc-data:/data
      - ${HOST_CONFIG_DIR:-oc-config}:/config
      - oc-output:/output
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:8000/health'',timeout=3).status==200 else 1)"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [metrics]
    restart: unless-stopped
    networks:
      - oc-observability
    depends_on:
      oc:
        condition: service_healthy
    command:
      - --config.file=${PROMETHEUS_CONFIG_FILE:-/etc/prometheus/openchronicle.yml}
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:${HOST_PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/openchronicle.yml:ro
      - ./monitoring/prometheus/prometheus-auth.yml:/etc/prometheus/openchronicle-auth.yml:ro
      - ${HOST_PROMETHEUS_DATA_DIR:-prometheus-data}:/prometheus
      - ${HOST_PROMETHEUS_SECRETS_DIR:-prometheus-secrets}:/etc/prometheus/secrets:ro

volumes:
  oc-data:
  oc-config:
  oc-output:
  prometheus-data:
  prometheus-secrets:

networks:
  oc-observability:
    driver: bridge
